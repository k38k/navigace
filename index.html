<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Navigace pro vozidla</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f5a43">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
/* Mapa přes celou obrazovku, nad ní plovoucí panel (počítač vlevo, mobil dole). Při navigaci: pruh s pokynem nahoře, stav jízdy dole. */
:root {
  --bg: #e9eef2;
  --panel: #ffffff;
  --panel-2: #f3f6f9;
  --fg: #0f1d2a;
  --muted: #5d6b78;
  --line: #dfe6ec;
  --accent: #0b6bcb;
  --accent-fg: #ffffff;
  --go: #0f7a55;
  --go-fg: #ffffff;
  --stop: #c9342b;
  --banner: #0f5a43;
  --banner-fg: #ffffff;
  --warn-bg: #fff4dc; --warn-fg: #6a4800;
  --err-bg: #fde9e7; --err-fg: #8d1d15;
  --c-motorway: #2464d6;
  --c-primary: #12a05f;
  --c-secondary: #e5a400;
  --c-tertiary: #ea6c14;
  --c-minor: #d33b3b;
  --shadow: 0 10px 30px rgba(15, 29, 42, .18), 0 2px 6px rgba(15, 29, 42, .08);
  --font-display: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --font-body: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1218; --panel: #141c24; --panel-2: #1b2530; --fg: #e8eef3; --muted: #95a3b0; --line: #26323e;
    --accent: #4f9bff; --accent-fg: #06121f; --go: #23b07c; --go-fg: #04150e; --stop: #ef5b50;
    --banner: #13664c; --banner-fg: #ffffff;
    --warn-bg: #352a0c; --warn-fg: #f5d68b; --err-bg: #3b1613; --err-fg: #ffb3aa;
    --c-motorway: #5b93ff; --c-primary: #2fc47f; --c-secondary: #f3c234; --c-tertiary: #f78a3d; --c-minor: #f0605a;
    --shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1218; --panel: #141c24; --panel-2: #1b2530; --fg: #e8eef3; --muted: #95a3b0; --line: #26323e;
  --accent: #4f9bff; --accent-fg: #06121f; --go: #23b07c; --go-fg: #04150e; --stop: #ef5b50;
  --banner: #13664c; --banner-fg: #ffffff;
  --warn-bg: #352a0c; --warn-fg: #f5d68b; --err-bg: #3b1613; --err-fg: #ffb3aa;
  --c-motorway: #5b93ff; --c-primary: #2fc47f; --c-secondary: #f3c234; --c-tertiary: #f78a3d; --c-minor: #f0605a;
  --shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font-body); -webkit-tap-highlight-color: transparent; }
#map { position: fixed; inset: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- panel ---------- */
#panel {
  position: fixed; z-index: 10; top: calc(16px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  width: 400px; max-height: calc(100% - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  background: var(--panel); border-radius: var(--r); box-shadow: var(--shadow);
  display: flex; flex-direction: column; overflow: hidden;
}
#panel .scroll { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; overscroll-behavior: contain; }
.collapsible { display: flex; flex-direction: column; gap: 16px; }
.handle { display: none; }
.head { display: flex; align-items: center; gap: 10px; }
.logo { width: 36px; height: 36px; border-radius: 10px; background: var(--go); color: var(--go-fg); display: grid; place-items: center; flex: none; }
.logo svg { width: 22px; height: 22px; }
h1 { font: 800 19px/1.1 var(--font-display); margin: 0; letter-spacing: -.01em; }
.chip {
  margin-left: auto; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px;
  padding: 6px 10px; background: var(--panel-2); font-size: 13px; font-weight: 600; max-width: 62%;
}
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip svg { width: 16px; height: 16px; }

.stops { display: flex; flex-direction: column; gap: 6px; position: relative; }
.stop { position: relative; display: flex; align-items: center; gap: 8px; }
.pin { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 800 12px var(--font-display); color: #fff; }
.pin.s { background: var(--go); }
.pin.m { background: var(--accent); }
.pin.e { background: var(--stop); }
.field { flex: 1; min-width: 0; position: relative; }
.field input {
  width: 100%; border: 1px solid transparent; background: var(--panel-2); border-radius: 12px; padding: 11px 12px; outline: none;
}
.field input:focus { border-color: var(--accent); background: var(--panel); }
.icon-btn {
  flex: none; width: 38px; height: 38px; border-radius: 10px; border: 0; background: transparent; color: var(--muted);
  display: grid; place-items: center;
}
.icon-btn:hover { background: var(--panel-2); color: var(--fg); }
.suggest {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 30; list-style: none; margin: 0; padding: 6px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
}
.suggest li { padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.suggest li small { display: block; color: var(--muted); font-size: 12px; }
.suggest li[aria-selected="true"], .suggest li:hover { background: var(--panel-2); }
.links { display: flex; gap: 6px; flex-wrap: wrap; }
.link {
  border: 0; background: transparent; color: var(--accent); font-weight: 600; font-size: 14px; padding: 6px 8px; border-radius: 8px;
  display: inline-flex; align-items: center; gap: 6px;
}
.link:hover { background: var(--panel-2); }
.link svg { width: 18px; height: 18px; }

.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--panel-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg label { position: relative; text-align: center; padding: 8px 6px; border-radius: 9px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--panel); color: var(--fg); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); }

details.box { background: var(--panel-2); border-radius: 12px; }
details.box > summary { list-style: none; cursor: pointer; padding: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
details.box > summary::-webkit-details-marker { display: none; }
details.box > summary .sum-r { margin-left: auto; color: var(--muted); font-weight: 500; font-size: 13px; text-align: right; }
details.box > summary::after { content: ""; flex: none; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin: 0 4px 4px 4px; transition: transform .15s; }
details.box[open] > summary::after { transform: rotate(-135deg); margin-bottom: -2px; }
details.box .inner { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 10px; }
.lbl { font-size: 12px; color: var(--muted); font-weight: 500; }
select.inp, input.inp { width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 10px; }
.dims { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dims > div { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.unit { position: relative; }
.unit input { padding-right: 30px; font-variant-numeric: tabular-nums; }
.unit span { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 12px; }
.dims.off { opacity: .45; pointer-events: none; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > .grow { flex: 1; min-width: 120px; width: auto; }
.btn {
  border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; font-family: var(--font-display); font-size: 15px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn.small { padding: 9px 12px; font-size: 14px; border-radius: 10px; }
.btn.go { background: var(--go); color: var(--go-fg); }
.btn.pri { background: var(--accent); color: var(--accent-fg); }
.btn.sec { background: var(--panel-2); color: var(--fg); }
.btn.ghost { background: transparent; color: var(--stop); }
.btn:disabled { opacity: .55; cursor: progress; }
.msg { padding: 10px 12px; border-radius: 10px; font-size: 13px; margin: 0; }
.msg.warn { background: var(--warn-bg); color: var(--warn-fg); }
.msg.err { background: var(--err-bg); color: var(--err-fg); }
.hint { font-size: 12px; color: var(--muted); margin: 0; }

.result { display: flex; flex-direction: column; gap: 12px; }
.summary { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.summary .big { font: 800 30px/1 var(--font-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.summary .km { font: 700 18px var(--font-display); color: var(--muted); }
.summary .eta { margin-left: auto; font-size: 13px; color: var(--muted); }
.bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--line); gap: 2px; }
.bar i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.variants { display: flex; flex-direction: column; gap: 6px; }
.variant { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; text-align: left; padding: 10px 12px; border-radius: 12px; border: 2px solid transparent; background: var(--panel-2); }
.variant.on { border-color: var(--accent); }
.variant b { font-weight: 600; }
.variant .t { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.variant .s { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
ol.steps { list-style: none; margin: 0; padding: 0; }
ol.steps li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 8px 2px; border-top: 1px solid var(--line); cursor: pointer; font-size: 14px; }
ol.steps li:hover { background: var(--panel); }
ol.steps .ico { color: var(--accent); display: grid; place-items: center; }
ol.steps .d { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.go-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }

/* ---------- markery ---------- */
.mk { width: 32px; height: 32px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); display: grid; place-items: center; border: 3px solid #fff; box-shadow: 0 3px 8px rgba(0,0,0,.35); cursor: grab; }
.mk b { transform: rotate(45deg); color: #fff; font: 800 13px var(--font-display); }
.puck { width: 44px; height: 44px; display: grid; place-items: center; }
.puck svg { width: 44px; height: 44px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.4)); }

/* ---------- navigace ---------- */
#banner {
  position: fixed; z-index: 20; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  max-width: 560px; margin: 0 auto; background: var(--banner); color: var(--banner-fg); border-radius: 18px; box-shadow: var(--shadow);
  display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; padding: 14px 16px; overflow: hidden;
}
#banner .bi svg { width: 60px; height: 60px; stroke-width: 2.6; }
#b-dist { font: 800 34px/1 var(--font-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
#b-text { font-size: 16px; font-weight: 500; margin-top: 4px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
#b-then { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-size: 14px; background: rgba(0,0,0,.2); margin: 0 -16px -14px; padding: 8px 16px; }
#b-then svg { width: 20px; height: 20px; }
#navbar {
  position: fixed; z-index: 20; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  max-width: 560px; margin: 0 auto; background: var(--panel); border-radius: 18px; box-shadow: var(--shadow);
  display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 16px;
}
#n-time { font: 800 24px/1 var(--font-display); font-variant-numeric: tabular-nums; color: var(--go); }
#n-sub { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
#navbar .sp { flex: 1; min-width: 0; }
.round { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--panel-2); display: grid; place-items: center; flex: none; font-weight: 700; }
.round.stopbtn { background: var(--stop); color: #fff; width: auto; border-radius: 23px; padding: 0 16px; font-family: var(--font-display); }
#speed {
  position: fixed; z-index: 20; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(92px + env(safe-area-inset-bottom, 0px));
  width: 64px; height: 64px; border-radius: 50%; background: var(--panel); box-shadow: var(--shadow);
  display: grid; place-items: center; text-align: center; line-height: 1;
}
#speed b { font: 800 22px var(--font-display); font-variant-numeric: tabular-nums; display: block; }
#speed small { font-size: 10px; color: var(--muted); }
#recenter {
  position: fixed; z-index: 20; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(92px + env(safe-area-inset-bottom, 0px));
  border: 0; border-radius: 23px; padding: 12px 16px; background: var(--panel); box-shadow: var(--shadow); font-weight: 700; display: flex; gap: 8px; align-items: center;
}
#toast {
  position: fixed; z-index: 40; left: 50%; transform: translateX(-50%); bottom: calc(100px + env(safe-area-inset-bottom, 0px));
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px);
}
body.nav #panel { display: none; }
.maplibregl-ctrl-group { border-radius: 12px !important; box-shadow: var(--shadow) !important; }
body.nav .maplibregl-ctrl-top-right { display: none; }

/* ---------- heslo ---------- */
#gate { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#gate form { background: var(--panel); border-radius: 20px; box-shadow: var(--shadow); padding: 24px; width: min(360px, 100%); display: flex; flex-direction: column; gap: 14px; }
#gate p { margin: 0; color: var(--muted); }
#gate input { border: 1px solid var(--line); background: var(--panel-2); border-radius: 12px; padding: 12px; }

.spinner { display: inline-block; width: 16px; height: 16px; border: 2.5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -3px; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }

/* ---------- mobil ---------- */
@media (max-width: 760px) {
  #panel {
    top: auto; left: 0; right: 0; bottom: 0; width: auto; border-radius: 20px 20px 0 0;
    max-height: 62%; padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #panel .scroll { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: 4px; }
  .handle { display: block; border: 0; background: transparent; padding: 10px 0 6px; width: 100%; flex: none; }
  .handle::before { content: ""; display: block; width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto; }
  #panel.min .collapsible { display: none; }
  #banner { grid-template-columns: 56px 1fr; padding: 12px 14px; }
  #banner .bi svg { width: 52px; height: 52px; }
  #b-dist { font-size: 30px; }
}
</style>
</head>
<body>
<div id="gate">
  <form id="gate-form">
    <div class="head"><span class="logo"><svg class="i" viewBox="0 0 24 24"><path d="M12 3 4 21l8-4 8 4z"/></svg></span><h1>Navigace pro vozidla</h1></div>
    <p>Zadej heslo.</p>
    <input id="gate-pw" type="password" autocomplete="current-password" aria-label="Heslo">
    <p id="gate-err" class="msg err" hidden>Špatné heslo, zkus to znovu.</p>
    <button class="btn pri" type="submit">Otevřít</button>
  </form>
</div>

<div id="map" role="application" aria-label="Mapa"></div>

<div id="panel">
  <button class="handle" id="handle" aria-label="Zobrazit nebo skrýt panel"></button>
  <div class="scroll">
    <div class="head">
      <span class="logo"><svg class="i" viewBox="0 0 24 24"><path d="M12 3 4 21l8-4 8 4z"/></svg></span>
      <h1>Navigace</h1>
      <button class="chip" id="veh-chip" title="Vozidlo"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg><span id="veh-chip-t">Vozidlo</span></button>
    </div>

    <div class="stops" id="stops"></div>
    <div class="links">
      <button class="link" id="add-stop"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Přidat zastávku</button>
      <button class="link" id="swap"><svg class="i" viewBox="0 0 24 24"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg>Prohodit</button>
    </div>

    <div class="collapsible">
      <div class="seg" role="radiogroup" aria-label="Výběr silnic">
        <label><input type="radio" name="pref" value="main" checked>Dálnice a I. třídy</label>
        <label><input type="radio" name="pref" value="fast">Nejrychlejší</label>
      </div>

      <div id="out" class="result" aria-live="polite"></div>

      <details class="box" id="veh-box">
        <summary>Vozidlo <span class="sum-r" id="veh-sum"></span></summary>
        <div class="inner">
          <div><label class="lbl" for="profile">Uložená vozidla</label><select class="inp" id="profile"></select></div>
          <div class="dims" id="dims">
            <div><label class="lbl" for="h">Výška</label><div class="unit"><input class="inp" id="h" type="number" inputmode="decimal" step="0.1" min="1" max="5"><span>m</span></div></div>
            <div><label class="lbl" for="w">Šířka</label><div class="unit"><input class="inp" id="w" type="number" inputmode="decimal" step="0.05" min="1" max="3.5"><span>m</span></div></div>
            <div><label class="lbl" for="l">Délka</label><div class="unit"><input class="inp" id="l" type="number" inputmode="decimal" step="0.5" min="2" max="30"><span>m</span></div></div>
            <div><label class="lbl" for="t">Hmotnost</label><div class="unit"><input class="inp" id="t" type="number" inputmode="decimal" step="0.5" min="0.5" max="60"><span>t</span></div></div>
          </div>
          <div class="row">
            <input class="inp grow" id="pname" type="text" placeholder="Název, třeba Moje Iveco" aria-label="Název vozidla">
            <button class="btn small pri" id="psave">Uložit vozidlo</button>
          </div>
          <div class="row"><p class="hint" id="psave-msg" style="flex:1">Uložené vozidlo si aplikace pamatuje i po zavření.</p><button class="btn small ghost" id="pdel" hidden>Smazat</button></div>
        </div>
      </details>

      <details class="box" id="voice-box">
        <summary>Hlasové pokyny <span class="sum-r" id="voice-sum"></span></summary>
        <div class="inner">
          <div><label class="lbl" for="voice">Hlas</label><select class="inp" id="voice"></select></div>
          <div><label class="lbl" for="rate">Rychlost řeči</label><select class="inp" id="rate">
            <option value="1">Normální</option><option value="1.15">Rychlejší</option><option value="1.3">Rychlá</option></select></div>
          <button class="btn small sec" id="voice-test">Vyzkoušet hlas</button>
          <p class="hint" id="voice-note"></p>
        </div>
      </details>
    </div>
  </div>
</div>

<div id="banner" hidden>
  <div class="bi" id="b-icon"></div>
  <div style="min-width:0"><div id="b-dist"></div><div id="b-text"></div></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
function startApp() {
  "use strict";
  var VALHALLA = "https://valhalla1.openstreetmap.de";
  var PHOTON = "https://photon.komoot.io";
  var CZ_BBOX = "12.09,48.55,18.87,51.06";
  var $ = function (id) { return document.getElementById(id); };

  function toast(t, ms) { var x = $("toast"); x.textContent = t; x.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { x.hidden = true; }, ms || 3500); }

  // ---------- ikony manévrů ----------
  var P = {
    straight: '<path d="M12 21V4M6 10l6-6 6 6"/>',
    right: '<path d="M7 21v-8a4 4 0 0 1 4-4h9M16 5l4 4-4 4"/>',
    slight: '<path d="M9 21v-7l8-8M11 6h6v6"/>',
    sharp: '<path d="M8 3v10l8 8M10 21h6v-6"/>',

    flag: '<path d="M6 21V4M6 4h12l-3 4 3 4H6"/>',
    merge: '<path d="M12 21v-9L6 4M12 12l6-8M15 4h3v3"/>'
  };
  var MAN = { 1: ["straight"], 2: ["straight"], 3: ["straight"], 4: ["flag"], 5: ["flag"], 6: ["flag"], 7: ["straight"], 8: ["straight"],
    9: ["slight"], 10: ["right"], 11: ["sharp"], 12: ["uturn", 1], 13: ["uturn"], 14: ["sharp", 1], 15: ["right", 1], 16: ["slight", 1],
    17: ["straight"], 18: ["slight"], 19: ["slight", 1], 20: ["slight"], 21: ["slight", 1], 22: ["straight"], 23: ["slight"], 24: ["slight", 1],
    25: ["merge"], 26: ["round"], 27: ["round"], 28: ["straight"], 29: ["straight"] };
  function icon(type) {

  }
  function isEnd(m) { return m.type === 4 || m.type === 5 || m.type === 6; }

  // ---------- třídy silnic ----------
  var GROUPS = [
    { key: "motorway", name: "Dálnice", css: "--c-motorway", mult: 1.0 },
    { key: "primary", name: "I. třída", css: "--c-primary", mult: 1.05 },
    { key: "secondary", name: "II. třída", css: "--c-secondary", mult: 1.7 },

  function groupOf(rc) {

    if (rc === "tertiary") return "tertiary";

  }

  // ---------- formáty ----------
  function fmtTime(s) { var m = Math.round(s / 60), h = Math.floor(m / 60); return h ? h + " h " + (m % 60) + " min" : m + " min"; }
  function fmtKm(km) { return km < 1 ? Math.round(km * 100) * 10 + " m" : km.toFixed(km < 10 ? 1 : 0).replace(".", ",") + " km"; }
  function fmtDist(m) {
    if (m < 1000) { var r = m < 100 ? Math.max(10, Math.round(m / 10) * 10) : Math.round(m / 50) * 50; return r + " m"; }
    return (m / 1000).toFixed(m < 10000 ? 1 : 0).replace(".", ",") + " km";
  }
  function clock(sec) { return new Date(Date.now() + sec * 1000).toLocaleTimeString("cs-CZ", { hour: "2-digit", minute: "2-digit" }); }
  // "300 metrů", "1 kilometr", "2 kilometry", "1,5 kilometru", "5 kilometrů"
  function sayDist(m) {
    if (m < 950) { var r = m < 300 ? Math.round(m / 50) * 50 : Math.round(m / 100) * 100; r = Math.max(50, r); return r + " metrů"; }
    var k = m < 10000 ? Math.round(m / 500) / 2 : Math.round(m / 1000);
    if (k % 1) return String(k).replace(".", ",") + " kilometru";
    if (k === 1) return "1 kilometr";
    if (k < 5) return k + " kilometry";
    return k + " kilometrů";
  }
  function lc(s) { return s ? s.charAt(0).toLowerCase() + s.slice(1) : s; }
  // Valhalla občas píše sloveso uprostřed věty velkým písmenem ("Poté za 100 metrů, Držte se…") a přidává čísla silnic ("…, 38H").
  var VERBS = /([^.!?]\s)(Držte|Odbočte|Jeďte|Vjeďte|Sjeďte|Pokračujte|Otočte|Zařaďte|Vyjeďte|Najeďte|Dorazili|Dorazíte|Zůstaňte|Přejeďte|Nastupte|Vystupte)/g;
  function fixText(s) {
    return (s || "").replace(VERBS, function (_, a, b) { return a + b.toLowerCase(); })
      .replace(/metrů, /g, "metrů ").replace(/, \d{1,4}[A-Z]?(?=[.,]|$)/g, "");
  }
  function n(v) { return String(v).replace(".", ","); }

  // ---------- geometrie ----------
  var R = 6371000;
  function rad(d) { return d * Math.PI / 180; }
  function hav(a, b) {
    var dLat = rad(b[0] - a[0]), dLon = rad(b[1] - a[1]);
    var x = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLon / 2) * Math.sin(dLon / 2);

  }
  function bearing(a, b) {
    var y = Math.sin(rad(b[1] - a[1])) * Math.cos(rad(b[0]));
    var x = Math.cos(rad(a[0])) * Math.sin(rad(b[0])) - Math.sin(rad(a[0])) * Math.cos(rad(b[0])) * Math.cos(rad(b[1] - a[1]));

  }
  function project(p, a, b) {
    var k = Math.cos(rad(p[0])), ax = a[1] * k, ay = a[0], bx = b[1] * k, by = b[0], px = p[1] * k, py = p[0];
    var dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy, t = L ? ((px - ax) * dx + (py - ay) * dy) / L : 0;
    t = Math.max(0, Math.min(1, t));

  }
  function decode(str) {

      do { b = str.charCodeAt(idx++) - 63; res |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);

      out.push([lat / f, lng / f]);
    }
    return out;
  }
  var ll = function (p) { return [p[1], p[0]]; };
  function lineFC(coords, props) { return { type: "FeatureCollection", features: coords.length > 1 ? [{ type: "Feature", properties: props || {}, geometry: { type: "LineString", coordinates: coords } }] : [] }; }

  // ---------- mapa ----------
  var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
  var map = new maplibregl.Map({
    container: "map",
    style: "https://tiles.openfreemap.org/styles/" + (dark ? "dark" : "liberty"),
    center: [15.45, 49.8], zoom: 6.4, minZoom: 5.5,
    maxBounds: [[10.5, 47.6], [20.4, 51.9]],
    attributionControl: { compact: true }
  });
  map.addControl(new maplibregl.NavigationControl({ showCompass: true }), "top-right");
  var mapReady = new Promise(function (res) {
    map.on("load", function () {
      // české popisky místo anglických
      map.getStyle().layers.forEach(function (l) {
        if (l.type === "symbol" && l.layout && l.layout["text-field"] && JSON.stringify(l.layout["text-field"]).indexOf("name") >= 0) {
          map.setLayoutProperty(l.id, "text-field", ["coalesce", ["get", "name:cs"], ["get", "name"]]);
        }
      });
      var empty = { type: "FeatureCollection", features: [] };
      ["alts", "route", "done"].forEach(function (s) { map.addSource(s, { type: "geojson", data: empty }); });
      var lay = map.getStyle().layers, before;
      for (var i = 0; i < lay.length; i++) { if (lay[i].type === "symbol") { before = lay[i].id; break; } }
      var round = { "line-join": "round", "line-cap": "round" };
      var w = function (a, b) { return ["interpolate", ["linear"], ["zoom"], 6, a, 16, b]; };
      map.addLayer({ id: "alts-casing", type: "line", source: "alts", layout: round, paint: { "line-color": "#ffffff", "line-width": w(6, 15), "line-opacity": .7 } }, before);
      map.addLayer({ id: "alts-line", type: "line", source: "alts", layout: round, paint: { "line-color": "#8896a4", "line-width": w(3.5, 10) } }, before);
      map.addLayer({ id: "done-line", type: "line", source: "done", layout: round, paint: { "line-color": "#9aa6b2", "line-width": w(3.5, 11) } }, before);
      map.addLayer({ id: "route-casing", type: "line", source: "route", layout: round, paint: { "line-color": "#ffffff", "line-width": w(6.5, 17) } }, before);
      map.addLayer({ id: "route-line", type: "line", source: "route", layout: round, paint: { "line-color": ["get", "color"], "line-width": w(3.5, 11) } }, before);
      map.on("click", "alts-line", function (e) {
        var i = e.features[0].properties.idx;
        if (state.legs.length === 1) { state.legs[0].sel = i; buildPlan(); render(false); }
      });
      map.on("mouseenter", "alts-line", function () { map.getCanvas().style.cursor = "pointer"; });
      map.on("mouseleave", "alts-line", function () { map.getCanvas().style.cursor = ""; });
      res();
    });
  });

  // ---------- zastávky ----------
  var state = { stops: [null, null], legs: [], plan: null };
  var markers = [];
  function pinClass(i) { return i === 0 ? "s" : i === state.stops.length - 1 ? "e" : "m"; }
  function pinLetter(i) { return String.fromCharCode(65 + i); }
  function renderStops() {
    var box = $("stops"); box.textContent = "";
    state.stops.forEach(function (s, i) {
      var row = el("div", "stop");
      var pin = el("span", "pin " + pinClass(i), pinLetter(i));
      var field = el("div", "field");
      var input = el("input"); input.type = "text"; input.autocomplete = "off"; input.id = "stop-" + i;
      input.placeholder = i === 0 ? "Odkud" : i === state.stops.length - 1 ? "Kam jedeš?" : "Zastávka";
      input.setAttribute("aria-label", input.placeholder);
      input.value = s ? s.label : "";
      var list = el("ul", "suggest"); list.hidden = true; list.setAttribute("role", "listbox");
      field.appendChild(input); field.appendChild(list);
      row.appendChild(pin); row.appendChild(field);
      if (i === 0) {
        var me = el("button", "icon-btn"); me.title = "Moje poloha"; me.setAttribute("aria-label", "Použít moji polohu");
        me.innerHTML = '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>';
        me.addEventListener("click", useMyLocation);
        row.appendChild(me);
      } else if (i < state.stops.length - 1) {
        var rm = el("button", "icon-btn"); rm.title = "Odebrat zastávku"; rm.setAttribute("aria-label", "Odebrat zastávku");
        rm.innerHTML = '<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>';
        rm.addEventListener("click", function () { state.stops.splice(i, 1); renderStops(); autoRoute(); });
        row.appendChild(rm);
      }
      setupSearch(input, list, i);
      box.appendChild(row);
    });
    syncMarkers();
  }
  function syncMarkers() {
    markers.forEach(function (m) { m.remove(); }); markers = [];
    state.stops.forEach(function (s, i) {
      if (!s) return;
      var d = el("div"), drop = el("div", "mk"); d.appendChild(drop);
      drop.style.background = cssVar(i === 0 ? "--go" : i === state.stops.length - 1 ? "--stop" : "--accent");
      drop.appendChild(el("b", null, pinLetter(i)));
      var m = new maplibregl.Marker({ element: d, draggable: true, anchor: "bottom", offset: [0, -4] }).setLngLat([s.lon, s.lat]).addTo(map);
      m.on("dragend", function () {
        var p = m.getLngLat();
        state.stops[i] = { lat: p.lat, lon: p.lng, label: p.lat.toFixed(5) + ", " + p.lng.toFixed(5) };
        var inp = $("stop-" + i); if (inp) inp.value = state.stops[i].label;
        reverse(i, p.lat, p.lng); autoRoute();
      });
      markers.push(m);
    });
  }
  function setStop(i, lat, lon, label, rev) {
    state.stops[i] = { lat: lat, lon: lon, label: label || (lat.toFixed(5) + ", " + lon.toFixed(5)) };
    var inp = $("stop-" + i); if (inp) inp.value = state.stops[i].label;
    syncMarkers();
    if (rev) reverse(i, lat, lon);
  }
  function autoRoute() { if (state.stops.every(Boolean)) findRoute(); else clearRoute(); }
  map.on("click", function (e) {
    if (nav.active) return;
    if (map.getLayer("alts-line") && map.queryRenderedFeatures(e.point, { layers: ["alts-line"] }).length) return;
    var i = state.stops.findIndex(function (s) { return !s; });
    if (i < 0) i = state.stops.length - 1;
    setStop(i, e.lngLat.lat, e.lngLat.lng, null, true);
    autoRoute();
  });
  $("add-stop").addEventListener("click", function () {
    if (state.stops.length >= 7) { toast("Víc než 5 zastávek zatím nejde."); return; }
    state.stops.splice(state.stops.length - 1, 0, null); renderStops();
    var inp = $("stop-" + (state.stops.length - 2)); if (inp) inp.focus();
  });
  $("swap").addEventListener("click", function () { state.stops.reverse(); renderStops(); autoRoute(); });
  function useMyLocation() {
    if (!navigator.geolocation) { toast("Tohle zařízení nezná polohu."); return; }
    toast("Zjišťuji polohu…", 8000);
    navigator.geolocation.getCurrentPosition(function (p) {
      $("toast").hidden = true;
      setStop(0, p.coords.latitude, p.coords.longitude, "Moje poloha");
      if (!state.stops.every(Boolean)) map.easeTo({ center: [p.coords.longitude, p.coords.latitude], zoom: Math.max(map.getZoom(), 12) });
      autoRoute();
    }, function (err) {
      toast(err.code === 1 ? "Přístup k poloze je zakázaný. Povol ho v nastavení prohlížeče." : "Polohu se nepodařilo zjistit.", 5000);
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 });
  }

  // ---------- hledání adres ----------
  function fmtPlace(p) {
    var street = [p.street, p.housenumber].filter(Boolean).join(" ");
    var main = p.name || street || p.city || "";
    var rest = [p.name && street ? street : "", p.city !== main ? p.city : "", p.county].filter(function (x) { return x && x !== main; });
    return { main: main, rest: rest.join(", "), short: main + (p.city && p.city !== main ? ", " + p.city : "") };
  }
  function reverse(i, lat, lon) {
    fetch(PHOTON + "/reverse?lat=" + lat + "&lon=" + lon + "&limit=1").then(function (r) { return r.json(); }).then(function (j) {
      var f = j.features && j.features[0], s = state.stops[i];
      if (!f || !s || s.lat !== lat || s.lon !== lon) return;
      s.label = fmtPlace(f.properties).short;
      var inp = $("stop-" + i); if (inp) inp.value = s.label;
    }).catch(function () {});
  }
  function setupSearch(input, list, i) {
    var timer = null, items = [], active = -1, seq = 0;
    function close() { list.hidden = true; active = -1; }
    function choose(k) {
      var f = items[k]; if (!f) return;
      var c = f.geometry.coordinates; close();
      setStop(i, c[1], c[0], fmtPlace(f.properties).short);
      input.blur();

      autoRoute();
    }

        list.appendChild(li);
      });
      list.hidden = items.length === 0;
    }

      clearTimeout(timer);
      var q = input.value.trim();
      if (q.length < 3) { items = []; close(); return; }

        var my = ++seq, c = map.getCenter();
        fetch(PHOTON + "/api/?q=" + encodeURIComponent(q) + "&limit=8&bbox=" + CZ_BBOX + "&lat=" + c.lat.toFixed(3) + "&lon=" + c.lng.toFixed(3))
          .then(function (r) { return r.json(); })

            if (my !== seq) return;

  }

  // ---------- vozidla ----------
  var BUILTIN = [
    { id: "car", name: "Osobní auto", car: true },
    { id: "van", name: "Dodávka do 3,5 t", h: 2.8, w: 2.1, l: 6.5, t: 3.5 },
    { id: "truck12", name: "Nákladní auto 12 t", h: 3.6, w: 2.55, l: 10, t: 12 },
    { id: "semi", name: "Kamion 40 t", h: 4.0, w: 2.55, l: 16.5, t: 40 }
  ];
  var vehicles = load("navigace-vozidla") || { mine: [], current: "truck12" };
  var dimIds = ["h", "w", "l", "t"];
  function allProfiles() { return vehicles.mine.concat(BUILTIN); }
  function findProfile(id) { return allProfiles().filter(function (p) { return p.id === id; })[0]; }
  function renderProfiles() {
    var sel = $("profile"); sel.textContent = "";
    if (vehicles.mine.length) {
      var g1 = el("optgroup"); g1.label = "Moje vozidla";
      vehicles.mine.forEach(function (p) { var o = el("option", null, p.name); o.value = p.id; g1.appendChild(o); });
      sel.appendChild(g1);
    }
    var g2 = el("optgroup"); g2.label = "Předvolby";
    BUILTIN.forEach(function (p) { var o = el("option", null, p.name); o.value = p.id; g2.appendChild(o); });
    sel.appendChild(g2);
    if (!findProfile(vehicles.current)) vehicles.current = "truck12";
    sel.value = vehicles.current;
    applyProfile();
  }
  function applyProfile() {
    var p = findProfile(vehicles.current);
    $("dims").classList.toggle("off", !!p.car);
    dimIds.forEach(function (id) { $(id).value = p.car ? "" : p[id]; });
    var mine = vehicles.mine.some(function (x) { return x.id === p.id; });
    $("pdel").hidden = !mine;
    $("pname").value = mine ? p.name : "";
    updateVehSummary();
  }
  function num(id) { var v = parseFloat(String($(id).value).replace(",", ".")); return isFinite(v) && v > 0 ? v : undefined; }
  function updateVehSummary() {
    var p = findProfile(vehicles.current);
    $("veh-sum").textContent = p.name;
    $("veh-chip-t").textContent = p.car ? p.name : p.name + " · " + n(num("h") || "?") + " m · " + n(num("t") || "?") + " t";
  }
  $("profile").addEventListener("change", function () { vehicles.current = this.value; save("navigace-vozidla", vehicles); applyProfile(); autoRoute(); });
  dimIds.forEach(function (id) { $(id).addEventListener("change", function () { updateVehSummary(); autoRoute(); }); });
  $("psave").addEventListener("click", function () {
    var name = $("pname").value.trim();
    if (!name) { $("psave-msg").textContent = "Napiš název vozidla."; $("pname").focus(); return; }

      for (var i = a; i <= b; i++) { var r = project(p, pts[i], pts[i + 1]); if (r.d < best.d) { best = r; best.i = i; } }
    }
    scan(Math.max(0, nav.lastIdx - 3), Math.min(pts.length - 2, nav.lastIdx + 400));
    if (best.d > 80) scan(0, pts.length - 2);
    var cum = state.plan.cum;
    best.along = cum[best.i] + best.t * (cum[best.i + 1] - cum[best.i]);
    return best;
  }
  function onFix(p, v, acc, gpsHeading) {
    if (!nav.active || !state.plan) return;
    var plan = state.plan;
    nav.speed = nav.speed ? nav.speed * 0.5 + v * 0.5 : v;
    $("spd").textContent = Math.round(nav.speed * 3.6);
    var s = snap(p);
    var offLimit = Math.max(35, Math.min(acc, 60) * 1.2);
    var onRoute = s.d <= offLimit;
    nav.off = onRoute ? 0 : nav.off + 1;
    if (nav.off >= 3 && !nav.rerouting && Date.now() - nav.lastReroute > 8000) reroute(p);
    if (onRoute) { nav.lastIdx = s.i; nav.along = s.along; }
    var pos = onRoute ? s.q : p;
    var a = plan.pts[s.i], b = plan.pts[Math.min(s.i + 1, plan.pts.length - 1)];
    var hd = onRoute ? bearing(a, b) : (gpsHeading != null && !isNaN(gpsHeading) && nav.speed > 2 ? gpsHeading : (nav.prevPos ? bearing(nav.prevPos, p) : 0));
    nav.prevPos = p;
    puck.setLngLat(ll(pos)).setRotation(hd);
    if (nav.follow) {
      var z = nav.speed > 22 ? 15.2 : nav.speed > 12 ? 16 : 16.8;
      map.easeTo({ center: ll(pos), bearing: hd, pitch: 55, zoom: z, padding: { top: window.innerHeight * 0.42, bottom: 90, left: 0, right: 0 }, duration: nav.sim ? 200 : 900, easing: function (t) { return t; } });
    }
    if (onRoute && (nav.lastDraw == null || Math.abs(nav.lastDraw - s.i) >= 2)) { nav.lastDraw = s.i; drawProgress(s.i, pos); }
    guidance(onRoute ? nav.along : null);
  }
  function drawProgress(i, pos) {
    var plan = state.plan;
    mapReady.then(function () {
      map.getSource("route").setData(lineFC([ll(pos)].concat(plan.pts.slice(i + 1).map(ll)), { color: cssVar("--accent") }));
      map.getSource("done").setData(lineFC(plan.pts.slice(0, i + 1).map(ll).concat([ll(pos)])));
    });
  }
  function guidance(along) {
    var plan = state.plan, ms = plan.mans;
    if (along == null) { $("b-dist").textContent = "Mimo trasu"; $("b-text").textContent = "Přepočítávám trasu…"; $("b-then").hidden = true; return; }
    var k = ms.length - 1;
    for (var i = 1; i < ms.length; i++) { if (ms[i].at > along + 3) { k = i; break; } }
    var m = ms[k], dist = Math.max(0, m.at - along), v = Math.max(nav.speed, 4);
    // po projetí manévru: "Pokračujte X kilometrů"
    if (k !== nav.k) {
      if (nav.k >= 0 && dist > 2500 && !nav.spoken[k + "c"]) { say("Pokračujte " + sayDist(dist) + ".", true); }
      nav.spoken[k + "c"] = true; nav.k = k;
    }
    var farD = v > 22 ? 1500 : v > 14 ? 700 : 300;
    var nearD = Math.max(40, v * 7);
    if (!nav.spoken[k + "f"] && dist <= farD && dist > nearD + v * 6 + 40) {
      nav.spoken[k + "f"] = true;
      say("Za " + sayDist(dist) + " " + lc(fixText(m.verbal_transition_alert_instruction || m.verbal_pre_transition_instruction || m.instruction)));
    }
    if (!nav.spoken[k + "n"] && dist <= nearD) {
      nav.spoken[k + "n"] = nav.spoken[k + "f"] = true;
      var txt = fixText(m.verbal_pre_transition_instruction || m.instruction);
      var nx = ms[k + 1];
      if (nx && !/Poté|Potom/.test(txt) && nx.at - m.at < 250 && !isEnd(nx)) {
        txt += " Potom " + lc(fixText(nx.verbal_transition_alert_instruction || nx.instruction));
        nav.spoken[(k + 1) + "f"] = true;
      }
      say(txt);
    }
    // pruh nahoře
    $("b-icon").innerHTML = icon(m.type);
    $("b-dist").textContent = fmtDist(dist);
    $("b-text").textContent = m.instruction;
    var nx2 = ms[k + 1], th = $("b-then");
    if (nx2 && nx2.at - m.at < 400 && dist < 1500) { th.hidden = false; th.innerHTML = "Potom " + icon(nx2.type); th.appendChild(document.createTextNode(" " + nx2.instruction)); }
    else th.hidden = true;
    // zbývá
    var cur = ms[Math.max(0, k - 1)], rest = 0;
    for (var j = k; j < ms.length; j++) rest += ms[j].time || 0;
    var curLen = (m.at - cur.at) || 1; rest += (cur.time || 0) * Math.min(1, dist / curLen);
    var left = plan.cum[plan.cum.length - 1] - along;
    $("n-time").textContent = fmtTime(rest);
    $("n-sub").textContent = fmtKm(left / 1000) + " · příjezd " + clock(rest);
    if (isEnd(m) && k === ms.length - 1 && dist < 25 && !nav.arrived) {
      nav.arrived = true; $("b-dist").textContent = "Cíl"; $("b-text").textContent = "Jste v cíli."; $("n-time").textContent = "V cíli";
    }
  }
  function reroute(p) {
    nav.rerouting = true; nav.lastReroute = Date.now();
    say("Přepočítávám trasu.");
    var plan = state.plan, legIdx = 0;
    while (legIdx < plan.legEnds.length - 1 && plan.legEnds[legIdx] < nav.lastIdx) legIdx++;
    var rest = state.stops.slice(legIdx + 1);
    var hd = nav.prevPos ? Math.round(bearing(nav.prevPos, p)) : null;
    findRoute({ silent: true, from: { lat: p[0], lon: p[1], heading: hd }, rest: rest }).then(function (ok) {
      nav.rerouting = false;
      if (!ok || !nav.active) return;
      nav.lastIdx = 0; nav.off = 0; nav.spoken = { "0n": true, "0f": true }; nav.k = -1; nav.along = 0; nav.lastDraw = null;
      drawProgress(0, p);
    });
  }

  // ---------- panel na mobilu ----------
  $("handle").addEventListener("click", function () { $("panel").classList.toggle("min"); });

  // ---------- start ----------
  renderProfiles();
  renderStops();
  if (!load("navigace-ukazka")) {
    save("navigace-ukazka", true);
    setStop(0, 50.0281, 15.2000, "Kolín"); setStop(1, 49.3961, 15.5912, "Jihlava");
    mapReady.then(function () { findRoute(); });
  }
}
(function () {
  var HASH = "cc8a220845d48740b42f5aa01faeffeb4f1583535b640324b1ff68e761b4fe6d";
  var gate = document.getElementById("gate");
  function sha(t) {
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)).then(function (b) {
      return Array.prototype.map.call(new Uint8Array(b), function (x) { return ("0" + x.toString(16)).slice(-2); }).join("");
    });
  }
  function open() { gate.hidden = true; startApp(); }
  var saved = null;
  try { saved = localStorage.getItem("navigace-klic"); } catch (e) {}
  if (saved === HASH) { open(); return; }
  document.getElementById("gate-pw").focus();
  document.getElementById("gate-form").addEventListener("submit", function (e) {
    e.preventDefault();
    sha(document.getElementById("gate-pw").value).then(function (h) {
      if (h === HASH) { try { localStorage.setItem("navigace-klic", h); } catch (e) {} open(); }
      else { document.getElementById("gate-err").hidden = false; }
    });
  });
})();
</script>
</body>
